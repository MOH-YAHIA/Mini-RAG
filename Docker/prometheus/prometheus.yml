global:
  scrape_interval: 15s

scrape_configs:
  # PostgreSQL metrics
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Qdrant metrics
  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: "/metrics"

  # Prometheus metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node exporter metrics
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
  
  # FastAPI metrics
  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: "/adfljiad_Adkeci"
